name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: bouquet
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: bouquetbrowse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bouquet -d bouquetbrowse_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_MODE: demo
      INTERNAL_API_TOKEN: localhost-proxy-demo-token
      NEXT_TELEMETRY_DISABLED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: {node-version: '24', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m pip install uv==0.10.9
      - run: uv sync --project apps/api --frozen
      - run: uv run --project apps/api ruff check apps/api
      - run: uv run --project apps/api ruff format --check apps/api
      - name: SQLite domain and API suite
        run: uv run --project apps/api pytest apps/api/tests -q
      - name: PostgreSQL integration suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://bouquet:test-only@127.0.0.1:5432/bouquetbrowse_test
        run: uv run --project apps/api pytest apps/api/tests -q
      - name: PostgreSQL migrations
        env:
          DATABASE_URL: postgresql+psycopg://bouquet:test-only@127.0.0.1:5432/bouquetbrowse_test
        run: |
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api alembic -c apps/api/alembic.ini downgrade base
          uv run --project apps/api alembic -c apps/api/alembic.ini upgrade head
          uv run --project apps/api python deploy/verify_migration.py
      - run: npm ci --ignore-scripts --no-fund
        working-directory: apps/web
      - name: Contract regeneration is deterministic
        run: |
          uv run --project apps/api python -m bouquetbrowse.cli openapi --output apps/api/openapi.json
          apps/web/node_modules/.bin/openapi-typescript apps/api/openapi.json -o apps/web/src/lib/generated-api.ts
          cd apps/web && npx prettier --write src/lib/generated-api.ts
          cd ../.. && git diff --exit-code -- apps/api/openapi.json apps/web/src/lib/generated-api.ts
      - run: npm run check && npm audit --omit=dev --audit-level=high && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker compose build api web
      - run: docker compose up -d --wait db api worker web
      - name: Clean Docker startup
        run: |
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/login
          node deploy/smoke.mjs
      - if: failure()
        run: docker compose logs --tail 100
