[project]
name = "bouquetbrowse"
version = "0.1.0"
description = "Evidence-first Hanoi bouquet discovery"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.52,<3",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "httpx>=0.28,<1",
  "pillow>=13.0,<14",
  "imagehash>=4.3,<5",
  "PyJWT[crypto]>=2.10,<3",
  "openai>=2,<3",
  "prometheus-client>=0.21,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.optional-dependencies]
vision = ["torch>=2.6,<3", "transformers>=4.51,<6"]
browser = [
    "playwright>=1.60,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
"bouquetbrowse/api.py" = ["B008"]
"bouquetbrowse/auth.py" = ["B008"]
